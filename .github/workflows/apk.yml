name: APK

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ovis-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Latest upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/devswha/ovis/releases/latest --jq .tag_name)
          TAG="$tag" python3 - << 'PY'
          import os, re, sys
          tag = os.environ["TAG"]
          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if not m:
              sys.exit(f"upstream tag is not vMAJOR.MINOR.PATCH: {tag}")
          major, minor, patch = map(int, m.groups())
          code = major * 1_000_000 + minor * 1_000 + patch
          if not 1 <= code <= 2_100_000_000:
              sys.exit(f"versionCode {code} is out of range")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\nversion={tag[1:]}\ncode={code}\n")
          print(f"upstream {tag} versionCode {code}")
          PY

      - name: Skip when this tag is already published
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already published $TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: devswha/ovis
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Bun
        if: steps.skip.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Stamp package id and version
        if: steps.skip.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CODE: ${{ steps.tag.outputs.code }}
        run: |
          set -euo pipefail
          file=app/android/app/build.gradle
          sed -i -E 's/applicationId "sh\.ovis\.app"/applicationId "sh.ovis.sideload"/' "$file"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" "$file"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" "$file"
          grep -n -E 'applicationId|versionCode|versionName' "$file"

      - name: Build the web shell and sync Capacitor
        if: steps.skip.outputs.skip != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd app
          bun install --frozen-lockfile
          bun run build:web
          bunx cap sync android

      - name: Sign and assemble the release APK
        if: steps.skip.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          ks="$RUNNER_TEMP/ovis-sideload.p12"
          props="$RUNNER_TEMP/upload.properties"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          chmod 600 "$ks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > "$props"
          cd app/android
          OVIS_UPLOAD_PROPERTIES="$props" ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cp app/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ovis-sideload-${VERSION}.apk"
          sha=$(git rev-parse HEAD)
          gh release create "$TAG" "$RUNNER_TEMP/ovis-sideload-${VERSION}.apk" \
            --repo "${{ github.repository }}" \
            --title "Ovis ${VERSION} sideload" \
            --notes "$(cat << EOF
          Unofficial sideload build of [devswha/ovis](https://github.com/devswha/ovis) \`${TAG}\` (\`${sha}\`).

          Package \`sh.ovis.sideload\`. Not the Play build, not their signing key, and no FCM push. Ovis is MIT, copyright 2026 devswha.

          Install with Obtainium from this repository. A Play install of \`sh.ovis.app\` is a different app.
          EOF
          )"
